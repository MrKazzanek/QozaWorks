<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Action Bar — Separators</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0e0e10;
    color: #e0e0e0;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 48px 24px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 56px;
  }

  header .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 12px;
  }

  header h1 {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 700;
    background: linear-gradient(90deg, #ff9830, #fcf062, #7aff83, #28c7fc, #c085ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.15;
    margin-bottom: 10px;
  }

  header p {
    font-size: 14px;
    color: #666;
    font-family: 'JetBrains Mono', monospace;
  }

  .section {
    max-width: 900px;
    margin: 0 auto 48px;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
  }

  .section-header h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #888;
    font-family: 'JetBrains Mono', monospace;
  }

  .section-header .line {
    flex: 1;
    height: 1px;
    background: #222;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 10px;
  }

  .swatch {
    border-radius: 10px;
    overflow: hidden;
    background: #18181b;
    border: 1px solid #222;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100px;
  }

  .swatch:hover {
    transform: translateY(-3px);
    border-color: #444;
  }

  .swatch:hover .copy-hint {
    opacity: 1;
  }

  .swatch-symbol {
    font-size: 24px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
  }

  .swatch-info {
    padding: 4px 10px 8px;
    text-align: center;
  }

  .swatch-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #444;
  }

  .copy-hint {
    position: absolute;
    top: 6px;
    right: 6px;
    background: rgba(0,0,0,0.7);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 9px;
    font-family: 'JetBrains Mono', monospace;
    color: #fff;
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
  }

  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1e1e22;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #e0e0e0;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 999;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .default-swatch-wrap {
    max-width: 900px;
    margin: 0 auto 48px;
  }

  .default-swatch {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #18181b;
    border: 1px solid #222;
    border-radius: 12px;
    padding: 16px 20px;
    cursor: pointer;
    transition: border-color 0.15s;
    width: fit-content;
  }

  .default-swatch:hover { border-color: #444; }

  .default-symbol-block {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #fff;
    flex-shrink: 0;
    border: 1px solid #333;
  }

  .default-label {
    font-size: 13px;
    color: #888;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 4px;
  }

  .default-cmd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #555;
    margin-top: 2px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">My Action Bar · Datapack</div>
  <h1>Separators Palette</h1>
  <p>/trigger [type] set &lt;id&gt;</p>
</header>

<!-- Default Inner -->
<div class="default-swatch-wrap">
  <div class="section-header">
    <h2>Default Separator</h2>
    <div class="line"></div>
  </div>
  <div class="default-swatch" onclick="copyCommand('separators', 0)">
    <div class="default-symbol-block">•</div>
    <div>
      <div class="default-label">separators set 0 — default</div>
      <div class="default-cmd">click to copy command</div>
    </div>
  </div>
</div>

<div id="palette"></div>

<div class="toast" id="toast"></div>

<script>
  const internalSymbols = [" ", "|", "||", "/", "//", "///", "+", "-", "*", "×", "÷", "=", ">", "<", "`", "'", ",", ".", ";", ":", "@", "#", "$", "&", "%", "!", "?", "^", "_", "~", "»", "x", "I", "°", "©", "®", "℗", "—", "¦", "※", "⁜", "⁂", "⌂", "●", "○", "◆", "◇", "■", "□", "▲", "▼", "◀", "▶", "›", "‹", "⭐", "✦", "✧", "✶", "✷", "❈", "❉", "❊", "❋"];

  const externalSymbols = [
    "[ ]", "{ }", "( )", "} {", ") (", "| |", "|| ||", "- -", "-- --", "-[ ]-", "-( )-", "-{ }-", "+ +", "= =", "== ==", "-= =-", "/ /", "// //", "> <", "< >", "-> <-", "-< >-", ": :", ": : : :", "I I", "• •", "« »", "» «", "› ‹", "‹ ›", "⭐ ⭐", "¦ ¦", "⁜ ⁜", "※ ※", "× ×", "# #", "% %", "$ $", "=| |=", "~ ~", "~~ ~~", "^ ^", "* *", "** **", "+- -+", "<| |>", "|< >|", "[[ ]]", "{{ }}", "<< >>", "(( ))", "° °", "○ ○", "● ●", "◆ ◆", "◇ ◇", "■ ■", "□ □", "▲ ▲", "▼ ▼", "◀ ▶", "◁ ▷", "@ @", "? ?"
  ];

  const categories = [
    {
      name: "Separators",
      type: "separators",
      items: internalSymbols
    },
    {
      name: "External Separators",
      type: "external_separators",
      items: externalSymbols
    }
  ];

  const palette = document.getElementById('palette');

  categories.forEach(cat => {
    const section = document.createElement('div');
    section.className = 'section';

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `<h2>${cat.name}</h2><div class="line"></div>`;
    section.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'grid';

    cat.items.forEach((symbol, index) => {
      const id = index + 1;
      const swatch = document.createElement('div');
      swatch.className = 'swatch';
      swatch.innerHTML = `
        <div class="swatch-symbol">${symbol === " " ? '<span style="font-size:10px; opacity:0.3">[SPACE]</span>' : symbol}</div>
        <div class="swatch-info">
          <div class="swatch-id">set ${id}</div>
        </div>
        <div class="copy-hint">copy cmd</div>
      `;
      swatch.addEventListener('click', () => copyCommand(cat.type, id));
      grid.appendChild(swatch);
    });

    section.appendChild(grid);
    palette.appendChild(section);
  });

  let toastTimer;
  function copyCommand(type, id) {
    const cmd = `/trigger ${type} set ${id}`;
    navigator.clipboard.writeText(cmd).then(() => {
      const toast = document.getElementById('toast');
      toast.textContent = `Copied: ${cmd}`;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    });
  }
</script>
</body>
</html>
