<body>

    
    <header id="site-header" class="scrolled">
        <div id="site-header-container">

                    <i class="fa-solid fa-globe"></i>
                    <span id="current-lang-text">PL</span>
                </button>
            </nav>
        </div>
    </header>

    <div class="error-container">

        <h2 class="error-title" data-i18n="error404Title">Strona nie została znaleziona</h2>
        <p class="error-desc" data-i18n="error404Desc">Przepraszamy, ale strona której szukasz nie istnieje, została przeniesiona lub zmieniono jej adres.</p>
        <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> <span data-i18n="btnBackHome">Wróć na Stronę Główną</span></a>
    </div>

        </div>

    <script>
        let translations = {};
        let currentLang = localStorage.getItem('kazanek_lang') || 'pl';

        fetch('data/translations.json')
            .then(res => res.json())
            .then(data => {
                translations = data;
                updateLangUI();
            }).catch(() => {});

        function updateLangUI() {
            const dict = translations[currentLang] || {};
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.innerText = dict[key];
            });
            document.getElementById('current-lang-text').innerText = currentLang.toUpperCase();
            document.documentElement.lang = currentLang;
        }

        function toggleLanguage() {
            currentLang = currentLang === 'pl' ? 'en' : 'pl';
            localStorage.setItem('kazanek_lang', currentLang);
            updateLangUI();
        }
    </script>
</body>
